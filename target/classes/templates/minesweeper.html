<style>
#game {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background-color: hsl(50, 52%, 93%);
    border-radius: 20px;
}
#info {
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
    background-color: hsl(0, 0%, 88%);
    padding: 5px;
    border-radius: 20px;
}
#info h2 {
    font-family: ui-monospace, monospace;
    font-size: 30px;
    font-weight: 400;
    margin: 0px;
}
#info img {
    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
}
#info img:hover {
    cursor: pointer;
}
#board {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    height: 100%;
    width: 100%;
}

/* Gamemode selection menu */
#board div#gamemode-select {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
#board div#gamemode-select button {
    padding: 18px;
    background-color: hsl(0, 0%, 88%);
    border-radius: 100px;
    border: hsl(0, 0%, 60%) solid 1px;
    font-size: 23px;
    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
}
#board div#gamemode-select button:hover {
    background-color: hsl(0, 0%, 78%);
    cursor: pointer;
}

/* Playing pieces */
#board div {
    display: flex;
    flex-direction: row;
    gap: 2px;
}
.piece {
    border: none;
    width: 40px;
    height: 40px;
    background-size: cover;
    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
    background-color: hsl(240, 10%, 92%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0px;
}
.piece:hover {
    cursor: pointer;
}
.piece[data-mode=" "]::after {
    content: "";
    background-color: hsl(0, 0%, 70%);
    margin: 1px;
    border-radius: 9px;
    width: 36px;
    height: 36px;
    display: flex;
}
.piece[data-mode="x"] {
    background-image: url("/flag");
}
.piece.clicked {
    font-size: 36px;
    font-weight: 450;
    background-image: none;
    display: flex;
    justify-content: center;
    align-items: center;
}
.piece.clicked::after, .piece.wrong::after, .piece.bomb::after, .piece.boom::after {
    content: none;
}
.piece.clicked[data-type="1"] {
    color: #00f;
}
.piece.clicked[data-type="2"] {
    color: #080;
}
.piece.clicked[data-type="3"] {
    color: #f00;
}
.piece.clicked[data-type="4"] {
    color: #008;
}
.piece.clicked[data-type="5"] {
    color: #800;
}
.piece.clicked[data-type="6"] {
    color: #088;
}
.piece.clicked[data-type="7"] {
    color: #000;
}
.piece.clicked[data-type="8"] {
    color: #888;
}
.piece.wrong {
    background-image: url("/wrong");
}
.piece.bomb {
    background-image: url("/bomb");
}
.piece.boom {
    background-image: url("/boom");
}

/* Popup (used for Help menu only right now) */
#background {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    left: 0px;
    top: 0px;
    width: 100%;
    height: 100%;
    background-color: hsla(0, 0%, 0%, 20%);
}
#popup {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 900px;
    height: fit-content;
    padding: 40px;
    background-color: hsl(0, 0%, 88%);
    border-radius: 30px;
}
/* #popup h2 {

} */
#popup h3 {
    margin: 0px;
    margin-top: 14px;
}
#popup p {
    margin: 0px;
}
#popup ul {
    margin: 0px;
}
</style>
<h1>Minesweeper</h1>
<div id="game">
    <div id="info" style="display: none;">
        <h2>Mines Left: </h2>
        <img onclick="reset();" src="/normal">
        <h2>Time Spent: </h2>
    </div>
    <div id="board">
        <div id="gamemode-select">
            <button onclick="start({x: 8, y: 8, mines: 10});">Beginner (8x8, 10 Mines)</button>
            <button onclick="start({x: 16, y: 16, mines: 40});">Intermediate (16x16, 40 Mines)</button>
            <button onclick="start({x: 30, y: 16, mines: 99});">Expert (30x16, 99 Mines)</button>
            <button onclick="helpPopup();">Help</button>
        </div>
    </div>
</div>
<script src="./minesweeper.js"></script>
