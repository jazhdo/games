<style>
main {
    display: flex;
    flex-direction: column;
    justify-content: left;
    align-items: center;
}
#turn {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 34px;
    font-weight: 500;
}
#board {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    width: 100%;
    height: 100%;
}
#board hr {
    border: none;
    height: 2px;
    width: 304px;

    background-color: black;
    margin: 0px;
}
#board div {
    display: flex;
    justify-content: space-around;
    align-items: center;

    width: 304px;
    height: 100px;
}
#board div hr {
    height: 100px;
    width: 2px;
}
#board div span {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 50px;
    font-weight: 500;

    height: 100px;
    width: 100px;
    
    background-color: hsl(0, 0%, 70%);

    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
}
</style>
<h1>Tic Tac Toe</h1>
<main>
    <h1 id="turn">Turn: X</h1>
    <div id="board">
        <div>
            <span></span>
            <hr>
            <span></span>
            <hr>
            <span></span>
        </div>
        <hr>
        <div>
            <span></span>
            <hr>
            <span></span>
            <hr>
            <span></span>
        </div>
        <hr>
        <div>
            <span></span>
            <hr>
            <span></span>
            <hr>
            <span></span>
        </div>
    </div>
</main>
<script>
const board = document.getElementById("board"), values = [
    [
        null,
        null,
        null
    ],
    [
        null,
        null,
        null
    ],
    [
        null,
        null,
        null
    ]
];
let mode = true;
const spotElementArray = board.querySelectorAll("div span"), turnElement = document.getElementById("turn");
for (i = 0; i < spotElementArray.length; i++) {
    const element = spotElementArray[i], row = Math.floor(i / 3), column = Math.floor(i % 3);
    element.onclick = (event) => {
        if (values[row][column] === null) {
            values[row][column] = mode;
            element.textContent = mode ? "X" : "O";
            mode = !mode;
            turnElement.textContent = "Turn: " + (mode ? "X" : "O");
        }
    }
}
</script>
