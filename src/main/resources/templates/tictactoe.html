<style>
main {

}

    font-weight: 500;
    margin: 0px;
    margin-bottom: 10px;
}

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    width: 100%;
    height: 100%;
}
#board hr {
    border: none;

}

        </div>
